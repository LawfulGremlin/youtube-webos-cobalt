name: Fix issue 38

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-patch:
    if: github.event.head_commit.message == 'Run one-time fix for Cobalt 23.lts.6 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Add missing GN build files to patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cobalt-patches/cobalt-23.lts.6.patch')
          current = path.read_text()
          marker = 'diff --git a/cobalt/adblock/BUILD.gn b/cobalt/adblock/BUILD.gn\n'
          if current.startswith(marker):
              raise SystemExit('Patch is already fixed')

          prefix = '''diff --git a/cobalt/adblock/BUILD.gn b/cobalt/adblock/BUILD.gn
          new file mode 100644
          index 000000000..a465b03e0
          --- /dev/null
          +++ b/cobalt/adblock/BUILD.gn
          @@ -0,0 +1,7 @@
          +
          +static_library("adblock") {
          +  deps = [
          +    "//cobalt/base",
          +    "//cobalt/adblock/content:copy_adblock_web_files",
          +  ]
          +}
          diff --git a/cobalt/adblock/content/BUILD.gn b/cobalt/adblock/content/BUILD.gn
          new file mode 100644
          index 000000000..7ea7d955
          --- /dev/null
          +++ b/cobalt/adblock/content/BUILD.gn
          @@ -0,0 +1,10 @@
          +copy("copy_adblock_web_files") {
          +  install_content = true
          +
          +  sources = [
          +    "adblockMain.js",
          +    "adblockMain.css",
          +  ]
          +
          +  outputs = [ "$sb_static_contents_output_data_dir/web/adblock/{{source_target_relative}}" ]
          +}
          '''
          prefix = '\n'.join(line[10:] if line.startswith('          ') else line for line in prefix.splitlines()) + '\n'
          path.write_text(prefix + current)
          PY
          git diff --check
          git apply --numstat cobalt-patches/cobalt-23.lts.6.patch >/dev/null
          rm .github/workflows/fix-issue-38.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cobalt-patches/cobalt-23.lts.6.patch .github/workflows/fix-issue-38.yml
          git commit -m 'Fix missing GN files in Cobalt 23.lts.6 patch'
          git push origin HEAD:main
