name: Watch upstream

# Pull-only shadow fork: polls upstream for release tags not yet merged into
# main and opens an issue here when one appears. Never pushes anywhere and
# never touches upstream. The merge itself is manual — see AGENTS.md and
# UPSTREAM.md.

on:
  schedule:
    - cron: '0 6 * * *'   # daily; GitHub cannot trigger on another repo's tags
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/RF1705/youtube-webos-cobalt-adfree.git
          # Upstream's tags collide with ours by name (both use vX.Y.Z), so
          # keep them under refs/tags/upstream/ — same as UPSTREAM.md prescribes locally.
          git fetch --no-tags upstream \
            '+refs/heads/main:refs/remotes/upstream/main' \
            '+refs/tags/v*:refs/tags/upstream/v*'

      - name: Find unmerged upstream release tags
        id: find
        run: |
          NEW=""
          for t in $(git tag -l 'upstream/v*' --sort=-creatordate); do
            git merge-base --is-ancestor "$t" HEAD || NEW="$NEW ${t#upstream/}"
          done
          NEW=${NEW# }
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Unmerged upstream release tags: ${NEW:-none}"

      - name: Open issue for a new tag
        if: steps.find.outputs.new != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.find.outputs.new }}
        run: |
          latest=${NEW%% *}
          title="Upstream $latest released: sync needed"
          # One issue per tag, ever. A closed issue means the tag was merged or
          # deliberately skipped; do not reopen it.
          if gh issue list --state all --limit 200 --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Issue for $latest already exists; nothing to do."
            exit 0
          fi

          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git config merge.ours.driver true
          if git merge --no-commit --no-ff upstream/main >/dev/null 2>&1; then
            trial="clean (fork-owned files kept by merge=ours). Still review hunk-by-hunk."
          else
            trial="conflicts. Resolve hunk-by-hunk per AGENTS.md."
          fi
          git merge --abort 2>/dev/null || true

          {
            echo "Unmerged upstream release tags: **$NEW**"
            echo
            echo "Trial merge of \`upstream/main\` into \`main\`: $trial"
            echo
            echo "Commits on \`upstream/main\` not in \`main\` ($(git rev-list --count HEAD..upstream/main)):"
            echo
            echo '```'
            git log --oneline HEAD..upstream/main | head -150
            echo '```'
            echo
            echo 'Sync routine (AGENTS.md):'
            echo
            echo '- [ ] Review upstream issues open and recently closed against this release'
            echo '- [ ] Merge locally, hunk-by-hunk; never take a whole shared file as ours'
            echo '- [ ] Grep merged upstream files for Cobalt-missing APIs (`.closest(`, `NodeList.forEach`, injected `<style>`)'
            echo '- [ ] Hardcoded remote keys become shortcut-registry actions'
            echo '- [ ] Build the bundle and run `node webapp/src/fork/test.mjs`'
            echo '- [ ] Record the decisions in `UPSTREAM.md`'
            echo '- [ ] Hardware-verify before any release (quality ladder too if the runtime or patch changed)'
            echo
            echo 'Close this issue once the tag is merged, or once the decision is not to take it.'
          } > body.md
          gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -F body=@body.md --jq .html_url
          echo "::error::$title (issue opened). Manual sync required."
          exit 1
